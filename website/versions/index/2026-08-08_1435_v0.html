<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lith</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23cfcdc4'/><text x='50' y='72' font-family='Times New Roman,serif' font-size='72' text-anchor='middle' fill='%23222'>l</text></svg>">
    <style>
        body {
            background: #faf8f0;
            /*  
            background #565869;
            card colour #343541
            boarder accent/text colour #8fbdd3 
            */
            color: #222;
            font-family: 'Times New Roman', Times, serif;
            margin: 0;
            min-height: 100vh;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .top-center {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            z-index: 10;
        }
        .gmt-time {
            font-size: 0.9rem;
            color: #7a776c;
            letter-spacing: 0.02em;
        }
        .main {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 96px 16px 32px;
        }
        .word {
            font-size: 2.25rem;
            font-weight: bold;
            margin-bottom: 8px;
            text-align: center;
            letter-spacing: 0.01em;
        }
        .pron {
            font-size: 1rem;
            color: #7a776c;
            margin-bottom: 8px;
            text-align: center;
        }
        .noun {
            font-style: italic;
            color: #8a8779;
            margin-bottom: 12px;
            text-align: center;
        }
        .definition {
            font-size: 1.05rem;
            color: #3d3b34;
            max-width: 420px;
            line-height: 1.5;
            text-align: center;
        }
        .definition-spacer {
            height: 28px;
        }
        .tagline {
            font-size: 1.05rem;
            color: #6a6760;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="top-center">
        <div class="gmt-time" id="gmt-time">--:-- --</div>
    </div>
    <div class="main" style="transform: translateY(-6%);">
        <div class="word">lith</div>
        <div class="noun">/noun/</div>
        <div class="noun">from the Greek líthos meaning &ldquo;stone&rdquo;</div>
        <div class="definition">
            a single block or slab of stone; the elemental unit from which foundations, monuments, and lasting things are built.
        </div>
        <div class="definition-spacer"></div>
        <div class="tagline">creating tools that shape stories</div>
    </div>
    <script>
        function updateGmtTime() {
            const now = new Date();
            const londonTime = new Intl.DateTimeFormat('en-GB', {
                timeZone: 'Europe/London',
                hour: '2-digit', minute: '2-digit', second: '2-digit',
                hour12: false
            }).format(now);
            const isBST = now.toLocaleString('en-GB', { timeZone: 'Europe/London', timeZoneName: 'short' }).includes('BST');
            const el = document.getElementById('gmt-time');
            if (el) el.textContent = `${londonTime} ${isBST ? 'BST' : 'GMT'}`;
        }
        updateGmtTime();
        setInterval(updateGmtTime, 1000);
    </script>
</body>
</html>
